[package]
name = "cake"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
nanoid = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4.23"
deser-hjson = "2.2.0"
serde_yaml_ng = "0.10"
directories = "5.0.1"
fd-lock = "4.0.4"
shlex = "2.0.1"
libc = "0.2.191"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
evalexpr = "13.1.0"

[dev-dependencies]
tempfile = "3"
serial_test = "3"

[profile.release]
strip = true # Automatically strip symbols from the binary
opt-level = "s" # Optimize for size
lto = true # Enable link time optimization
codegen-units = 1 # Maximize site reduction optimizations
# Smaller still (measured 2026-11-13, 1.77 MB with the lines above):
# panic = "abort"   # 1.63 MB: no unwinding/backtrace code; ratatui's panic
#                   # hook still restores the terminal before the abort
# opt-level = "z"   # 1.64 MB: like "s" but also skips loop vectorization
#                   # and inlines less; slower code, irrelevant for cake
# both              # 1.50 MB
# Dependencies that could go: nanoid (pulls rand, only the random id
# fallback; /dev/urandom is enough), serde_yaml_ng (~80 KB, frontmatter
# only), clap features (env, color, suggestions).
